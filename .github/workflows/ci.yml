name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Gate : tsc -b type-check le projet (build == typecheck ici, pas de
      # bundler séparé qui masquerait les erreurs de type comme sur
      # afpnews-api/tsdown).
      - name: Build (typecheck)
        run: pnpm run build

      # Gate : mocha, puis oxlint via posttest.
      - name: Test + lint
        run: pnpm test
